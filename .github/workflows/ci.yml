name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned so lint results are reproducible per commit and agree with what
  # `make lint` reports locally. Dependabot updates the action reference but
  # not this input, so bump it deliberately.
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  # Detect what files changed to skip tests on doc-only changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - '.golangci.yml'
              - 'Makefile'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -timeout=10m ./...

    - name: Run deadlock detection tests
      run: go test -v -race -timeout=10m -tags=deadlock ./...

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests
      run: go test -v -race -timeout=15m -tags=integration ./...

    - name: Run integration tests with deadlock detection
      run: go test -v -race -timeout=15m "-tags=integration,deadlock" ./...

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Run fuzz tests (quick)
      run: |
        # Budget each fuzz test in executions rather than wall time. A duration
        # makes the fuzzing engine build a deadline context, and a worker that is
        # mid-call when it expires reports "context deadline exceeded" as a test
        # failure. An execution count leaves that context unset, so the run ends
        # on the limit instead. 1000000x is roughly the previous 10s budget.
        # Corpus files from testdata/fuzz/ are also run as regression tests
        go test -fuzz=FuzzValidateFrameLength -fuzztime=1000000x ./internal/frame/
        go test -fuzz=FuzzValidateFrameChecksum -fuzztime=1000000x ./internal/frame/
        go test -fuzz=FuzzExtractFrameData -fuzztime=1000000x ./internal/frame/
        go test -fuzz=FuzzHandleErrorFrame -fuzztime=1000000x ./internal/frame/
        go test -fuzz=FuzzCalculateChecksum -fuzztime=1000000x ./internal/frame/
        go test -fuzz=FuzzBufferPool -fuzztime=1000000x ./internal/frame/

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout 5m

    # `golangci-lint run` does not report formatter drift in _test.go files, so
    # the formatters configured in .golangci.yml need checking separately or
    # test files drift unnoticed. The action puts the pinned binary on PATH.
    - name: Check formatting
      run: golangci-lint fmt --diff

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Build examples
      run: |
        for dir in examples/*/; do
          if [ -f "$dir/main.go" ]; then
            echo "Building $dir"
            (cd "$dir" && go build -v .)
          fi
        done

    - name: Cross-compile check
      run: |
        echo "Cross-compiling for Linux (amd64)..."
        GOOS=linux GOARCH=amd64 go build -v ./...
        echo "Cross-compiling for Linux (arm64)..."
        GOOS=linux GOARCH=arm64 go build -v ./...
        echo "Cross-compiling for Windows (amd64)..."
        GOOS=windows GOARCH=amd64 go build -v ./...
        echo "Cross-compiling for macOS (amd64)..."
        GOOS=darwin GOARCH=amd64 go build -v ./...
        echo "Cross-compiling for macOS (arm64)..."
        GOOS=darwin GOARCH=arm64 go build -v ./...

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Run tests with coverage
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: unittests
        fail_ci_if_error: false
